<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 52" width="860" height="52" role="img" aria-label="Flowing water never stagnates">
  <title>Flowing water never stagnates</title>

  <defs>
    <linearGradient id="fw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071525"/>
      <stop offset="100%" stop-color="#0a3346"/>
    </linearGradient>

    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe44a"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <clipPath id="fc">
      <rect width="860" height="52" rx="10"/>
    </clipPath>
  </defs>

  <rect width="860" height="52" rx="10" fill="url(#fw)"/>

  <g clip-path="url(#fc)">
    <ellipse cx="180" cy="36" rx="28" ry="6" fill="none" stroke="#38b2d8" stroke-width="0.5" opacity="0.18"/>
    <ellipse cx="680" cy="20" rx="24" ry="5" fill="none" stroke="#38b2d8" stroke-width="0.5" opacity="0.18"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-30,40;430,34;900,41" keyTimes="0;0.5;1" dur="25s" repeatCount="indefinite" additive="replace"/>
      <ellipse cx="0" cy="0" rx="9" ry="3" fill="url(#fg)"/>
      <path d="M -9,0 L -14,-4 L -14,4 Z" fill="#ffaa00" opacity="0.65"/>
      <circle cx="6" cy="-0.8" r="1" fill="#0a0a0a"/>
    </g>
  </g>

  <text x="430" y="24" font-family="Georgia, serif" font-size="11" letter-spacing="4" fill="#7ecfee"
        text-anchor="middle" opacity="0.72">流水不腐 · FLOWING WATER NEVER STAGNATES · astronishant</text>
</svg>
